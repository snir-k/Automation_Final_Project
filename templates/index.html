<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management Framework Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- FIXES REDUNDANCY & DEPRECATION WARNING: Removed all dynamic inline style codes -->
        <div class="nav-header">
            <a href="/other/home" id="static-home-link">Static Home Website Link</a>
        </div>

        <h1>Product Manager Architecture Hub</h1>

        <!-- DYNAMIC NOTIFICATION BLOCK -->
        <div id="ui-alert-box" class="alert"></div>

        <!-- PRODUCT INPUT FORM -->
        <!-- FIXES DEPRECATION WARNING: Removed inline onsubmit handler to use clean event binding -->
        <form id="product-form">
            <div class="form-group">
                <label for="product-name">Product Name:</label>
                <input type="text" id="product-name" name="name" required placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label for="product-price">Price:</label>
                <input type="text" id="product-price" name="price" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="product-image">Image Filename / URL:</label>
                <input type="text" id="product-image" name="image" placeholder="filename.png">
                <input type="file" id="file-uploader" accept="image/png, image/jpeg, image/jpg" style="margin-top: 5px;">
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary">Add / Update Product</button>
        </form>

        <!-- PRODUCT DETAILS CARD VIEW -->
        <div id="product-details" class="card" style="display: none; margin-top: 20px;">
            <div class="card-header">
                <h3>Product Insights</h3>
                <button type="button" id="close-details-btn" class="btn-close" onclick="closeProductDetails()">X</button>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span id="details-id"></span></p>
                <p><strong>Name:</strong> <span id="details-name"></span></p>
                <p><strong>Price:</strong> $<span id="details-price"></span></p>
                <div id="details-image-container" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- PRODUCT INVENTORY TABLE GRID -->
        <table class="table" id="products-table" style="margin-top: 20px;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Image</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Dynamically populated via JavaScript external async engine loops -->
            </tbody>
        </table>
    </div>

    <script src="/static/main.js"></script>
</body>
</html>
